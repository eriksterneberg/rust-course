[package]
name = "webprobe"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to fetch and parse JSON from URLs"

# TODO: Add your chosen dependencies below.
# Remember:
# - Use proper version specifications (not "*")
# - Consider which features you need
# - Think about whether you need async or blocking HTTP

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
reqwest = { version = "0.12.26", features = ["default-tls", "blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.14"
