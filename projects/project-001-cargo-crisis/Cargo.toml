[package]
name = "logforge"
version = "0.1.0"  # ISSUE: Is this valid semver?
edition = "2024"  # ISSUE: Should this be updated? -- I updated to 2024, the latest one
# ISSUE: Missing description - other teams need to know what this crate does
description = ""

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }  # ISSUE: Is this a good version specification? -- fixed
serde_json = "1.0.145"  # This one is actually fine -- fine, but I added the newest version just in case, although I don't actually understand what difference it makes if cargo update updates it freely anyway

[dev-dependencies]
# Used for testing

# ISSUE: Where are the [[bin]] declarations for logforge-cli and logforge-validate?  -- I fixed this error too
# The binaries exist in the source tree but Cargo doesn't know about them.
[[bin]]
name = "logforge-cli"
path = "src/bin/logforge_cli.rs"

[[bin]]
name = "logforge-validate"
path = "src/bin/validate.rs"

# ISSUE: There's no [lib] section. Is one needed? When would you need one? -- you need a [lib] section if you want to customize the name of your library or change the path.
